# Professional dual light/dark Streamlit theme for Agentic Text-to-SQL

[server]
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
paddingTop = "2rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#2563EB"
borderColor = "#E2E8F0"
codeTextColor = "#0F172A"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
linkColor = "#60A5FA"
borderColor = "#1E293B"
codeTextColor = "#E2E8F0"
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#111827"
dataframeHeaderTextColor = "#F8FAFC"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#2563EB"

[theme.dark.sidebar]
backgroundColor = "#070A12"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"
borderColor = "#1E293B"
primaryColor = "#3B82F6"
